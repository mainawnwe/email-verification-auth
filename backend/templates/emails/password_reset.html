<!doctype html>
<html>
  <body style="margin:0;padding:32px;background:#f4f4f7;
               font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <div style="max-width:480px;margin:auto;background:#fff;
                border-radius:12px;padding:36px;box-shadow:0 4px 16px rgba(0,0,0,.06)">
      <h2 style="margin:0 0 8px;color:#0f172a">Reset your password</h2>
      <p style="color:#475569;margin:0 0 20px;line-height:1.5">
        Hi {{ name }}, use the code below to reset your password.
        It's valid for <b>{{ ttl }} minutes</b>.
      </p>

      <div style="font-size:34px;font-weight:700;letter-spacing:10px;
                  background:#fef3c7;color:#92400e;padding:18px;
                  text-align:center;border-radius:10px;margin:24px 0;
                  font-family:ui-monospace,Menlo,monospace">
        {{ code }}
      </div>

      <p style="color:#94a3b8;font-size:13px;margin:0 0 4px">
        If you didn't request a reset, ignore this email — your password
        will stay the same.
      </p>
    </div>
  </body>
</html>
