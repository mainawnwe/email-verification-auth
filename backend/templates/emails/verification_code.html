<!doctype html>
<html>
  <body style="margin:0;padding:32px;background:#f4f4f7;
               font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <div style="max-width:480px;margin:auto;background:#ffffff;
                border-radius:12px;padding:36px;box-shadow:0 4px 16px rgba(0,0,0,.06)">
      <h2 style="margin:0 0 8px;color:#0f172a">Hi {{ name }},</h2>
      <p style="color:#475569;margin:0 0 20px;line-height:1.5">
        Use the code below to verify your email address. It's valid for
        <b>{{ ttl }} minutes</b>.
      </p>

      <div style="font-size:34px;font-weight:700;letter-spacing:10px;
                  background:#eef2ff;color:#4338ca;padding:18px;
                  text-align:center;border-radius:10px;margin:24px 0;
                  font-family:ui-monospace,Menlo,monospace">
        {{ code }}
      </div>

      <p style="color:#94a3b8;font-size:13px;margin:0 0 4px">
        Didn't request this? You can safely ignore this email.
      </p>
      <p style="color:#cbd5e1;font-size:12px;margin:20px 0 0;
                border-top:1px solid #e2e8f0;padding-top:16px">
        — The Email Verification Demo
      </p>
    </div>
  </body>
</html>
